<!doctype html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>Hermes Trading Lab · Virtual Office</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=JetBrains+Mono:wght@400;500&family=VT323&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #070a12;
      --surface: rgba(14, 20, 34, 0.88);
      --surface-2: rgba(10, 15, 26, 0.95);
      --border: rgba(148, 163, 184, 0.14);
      --text: #f1f5f9;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --good: #34d399;
      --warn: #fbbf24;
      --bad: #fb7185;
      --radius: 12px;
      --gap: 10px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "DM Sans", system-ui, sans-serif;
      font-size: 13px;
      color: var(--text);
      background: #020617;
      min-height: 100vh;
      overflow-x: hidden;
    }
    .vo-app {
      display: grid;
      grid-template-columns: 184px minmax(0, 1fr);
      min-height: 100vh;
    }
    .vo-sidebar {
      position: sticky;
      top: 0;
      align-self: start;
      height: 100vh;
      overflow: auto;
      border-right: 2px solid #123b63;
      background:
        linear-gradient(180deg, rgba(56,189,248,.04), transparent 24%),
        linear-gradient(180deg, #061428 0%, #020617 100%);
      padding: 7px 6px 8px;
      box-shadow: inset -2px 0 0 rgba(2,6,23,.8);
      font-size: 11px;
    }
    .vo-brand {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 7px;
      padding: 5px 6px;
      border: 1px solid #16466f;
      border-radius: 5px;
      background: rgba(2,6,23,.72);
    }
    .vo-robot {
      width: 28px;
      height: 28px;
      flex: 0 0 28px;
      display: grid;
      place-items: center;
      border: 1px solid #22c55e;
      border-radius: 3px;
      background: linear-gradient(180deg, #14532d, #052e16);
      font-size: 15px;
      image-rendering: pixelated;
    }
    .vo-brand strong {
      display: block;
      font-family: "VT323", monospace;
      font-size: 15px;
      color: #f8fafc;
      letter-spacing: .03em;
      line-height: 1;
    }
    .vo-brand span {
      display: block;
      margin-top: 1px;
      color: #38bdf8;
      font-size: 8px;
      letter-spacing: .06em;
      text-transform: uppercase;
    }
    .vo-nav {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 3px;
      margin-bottom: 7px;
    }
    .vo-nav button {
      width: 100%;
      text-align: center;
      border: 1px solid transparent;
      border-radius: 4px;
      background: transparent;
      color: #94a3b8;
      padding: 5px 4px;
      font-size: 10px;
      font-weight: 600;
      white-space: nowrap;
    }
    .vo-nav button:hover { border-color: rgba(56,189,248,.22); color: #e2e8f0; }
    .vo-nav button.active {
      border-color: #0ea5e9;
      background: rgba(14,165,233,.14);
      color: #bae6fd;
    }
    .vo-status-panel {
      border: 1px solid #22c55e;
      border-radius: 5px;
      padding: 5px 6px;
      margin-bottom: 7px;
      background: rgba(6,78,59,.16);
    }
    .vo-status-panel.standby { border-color: #facc15; background: rgba(69,53,9,.2); }
    .vo-status-panel.error { border-color: #fb7185; background: rgba(127,29,29,.2); }
    .vo-status-title {
      font-family: "VT323", monospace;
      font-size: 13px;
      color: #86efac;
      margin-bottom: 4px;
      letter-spacing: .03em;
      line-height: 1.1;
    }
    .vo-status-panel.standby .vo-status-title { color: #fde68a; }
    .vo-status-panel.error .vo-status-title { color: #fecdd3; }
    .vo-status-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 2px 5px;
    }
    .vo-status-row {
      display: flex;
      justify-content: space-between;
      gap: 4px;
      color: #94a3b8;
      font-size: 8px;
      padding: 1px 0;
      letter-spacing: .04em;
      text-transform: uppercase;
    }
    .vo-status-row b {
      color: #e2e8f0;
      font-family: "JetBrains Mono", monospace;
      font-size: 9px;
      font-weight: 500;
    }
    .vo-kpi-mini {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4px;
      margin-bottom: 6px;
    }
    .vo-kpi-mini .metric { padding: 4px 5px; border-radius: 5px; }
    .vo-kpi-mini .metric .lbl { font-size: 8px; letter-spacing: .04em; }
    .vo-kpi-mini .metric .val { font-size: 11px; margin-top: 1px; }
    .vo-kpi-mini .metric .sub { display: none; }
    .vo-controls {
      display: flex;
      flex-direction: column;
      gap: 4px;
      padding-top: 5px;
      border-top: 1px solid rgba(22,70,111,.55);
    }
    .vo-controls .conn {
      width: 100%;
      padding: 3px 4px;
      gap: 3px;
      border-radius: 5px;
    }
    .vo-controls .conn label { display: none; }
    .vo-controls .conn input {
      flex: 1;
      min-width: 0;
      padding: 4px 5px;
      font-size: 9px;
    }
    .vo-controls .conn button { padding: 4px 7px; font-size: 10px; }
    .vo-controls .toolbar-mini {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 3px;
    }
    .vo-controls .toolbar-mini button { padding: 4px 2px; font-size: 9px; }
    .vo-field-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 3px 4px;
    }
    .vo-field-grid .field-inline { flex-direction: column; align-items: stretch; gap: 2px; }
    .vo-field-grid .field-inline label { font-size: 8px; }
    .vo-field-grid input, .vo-field-grid select { padding: 4px 5px; font-size: 10px; width: 100%; }
    .vo-meta {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 4px;
      font-size: 8px;
      color: var(--muted);
      line-height: 1.2;
    }
    .vo-meta .badge { margin: 0; padding: 1px 5px; font-size: 8px; }
    .vo-main {
      min-width: 0;
      padding: 10px 12px 16px;
      background:
        radial-gradient(900px 420px at 100% -10%, rgba(56, 189, 248, 0.1), transparent),
        radial-gradient(700px 380px at 0% 0%, rgba(52, 211, 153, 0.06), transparent),
        #020617;
    }
    .app { max-width: none; margin: 0; padding: 0; }

    /* Header */
    .header {
      display: flex; flex-wrap: wrap; align-items: center; gap: 10px;
      position: sticky; top: 0; z-index: 50;
      padding: 10px 0 12px;
      margin-bottom: 8px;
      background: linear-gradient(180deg, rgba(7,10,18,.97) 70%, transparent);
      backdrop-filter: blur(8px);
    }
    .brand { flex: 1; min-width: 140px; }
    .brand h1 { margin: 0; font-size: 18px; font-weight: 700; letter-spacing: -0.02em; }
    .brand p { margin: 2px 0 0; font-size: 11px; color: var(--muted); }
    .conn {
      display: flex; align-items: center; gap: 6px;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 4px 6px 4px 10px;
    }
    .conn label { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
    .conn input { width: min(200px, 42vw); border: none; background: transparent; padding: 6px 4px; font-size: 12px; color: var(--text); }
    .conn input:focus { outline: none; }

    /* Metrics strip */
    .metrics {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: var(--gap);
      margin-bottom: var(--gap);
    }
    .metric {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 8px 11px;
      min-width: 0;
    }
    .metric .lbl { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
    .metric .val { font-size: 14px; font-weight: 700; margin-top: 3px; line-height: 1.2; }
    .metric .sub { font-size: 10px; color: var(--muted); margin-top: 2px; }
    .dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; margin-right: 5px; vertical-align: middle; }

    /* Toolbar */
    .toolbar {
      display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 7px 9px;
      margin-bottom: var(--gap);
    }
    .status-banner {
      display: none;
      margin-bottom: var(--gap);
      padding: 8px 10px;
      border-radius: var(--radius);
      border: 1px solid rgba(251, 191, 36, 0.35);
      background: rgba(120, 53, 15, 0.24);
      color: #fde68a;
      font-size: 11px;
      line-height: 1.35;
    }
    .status-banner.show { display: block; }
    .toolbar .group { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
    .toolbar .group.settings { flex: 1; min-width: 0; gap: 8px; }
    .toolbar .sep { width: 1px; height: 24px; background: var(--border); margin: 0 2px; }
    .field-inline { display: flex; align-items: center; gap: 5px; min-width: 0; }
    .field-inline label { font-size: 10px; color: var(--muted); white-space: nowrap; }
    .field-inline input, .field-inline select { width: 100%; min-width: 0; }
    .fld-symbol { flex: 1.2 1 180px; }
    .fld-usdt { flex: 0.65 1 96px; }
    .fld-mode { flex: 0.6 1 96px; }
    .fld-lev { flex: 0.95 1 160px; }
    .range-inline { display: grid; grid-template-columns: 1fr auto 1fr; gap: 4px; align-items: center; width: 100%; }
    .range-inline .sep { width: auto; height: auto; background: none; margin: 0; color: var(--muted); text-align: center; }

    input, select, button {
      font: inherit; color: var(--text);
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 7px 9px;
      font-size: 12px;
    }
    input:focus, select:focus { outline: 2px solid rgba(56, 189, 248, 0.25); border-color: rgba(56, 189, 248, 0.4); }
    select { cursor: pointer; }
    button { cursor: pointer; font-weight: 500; white-space: nowrap; }
    button:hover:not(:disabled) { border-color: rgba(148, 163, 184, 0.35); }
    button:disabled { opacity: 0.55; cursor: not-allowed; }
    button.sm { padding: 6px 10px; font-size: 11px; }
    button.busy { position: relative; padding-left: 26px; }
    button.busy::before {
      content: ""; position: absolute; left: 8px; top: 50%;
      width: 10px; height: 10px; margin-top: -5px;
      border: 2px solid rgba(255,255,255,.35); border-top-color: #fff;
      border-radius: 50%; animation: spin .7s linear infinite;
    }
    .btn-primary { background: linear-gradient(135deg, #0369a1, #0ea5e9); border-color: #38bdf8; }
    .btn-good { background: linear-gradient(135deg, #065f46, #0d9488); border-color: var(--good); }
    .btn-warn { background: linear-gradient(135deg, #92400e, #d97706); border-color: var(--warn); }
    .btn-danger { background: linear-gradient(135deg, #9f1239, #e11d48); border-color: var(--bad); }
    .btn-ghost { background: transparent; }

    .badge {
      font-size: 10px; font-weight: 600; padding: 3px 8px; border-radius: 999px;
      background: rgba(56, 189, 248, 0.12); color: var(--accent); border: 1px solid rgba(56, 189, 248, 0.25);
    }

    /* Tabs */
    .tabs {
      display: flex;
      justify-content: flex-end;
      gap: 4px;
      margin: -2px 0 var(--gap);
    }
    .tab {
      padding: 5px 10px; border-radius: 999px; border: 1px solid rgba(148,163,184,.12);
      background: rgba(15,23,42,.38); color: var(--muted); font-size: 10.5px; font-weight: 700;
      letter-spacing: .04em; text-transform: uppercase;
    }
    .tab.active { background: rgba(56,189,248,.13); border-color: rgba(56,189,248,.32); color: #bae6fd; }
    .panel-view { display: none; }
    .panel-view.active { display: block; }

    /* Grid panels */
    .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--gap); }
    .grid-2 { display: grid; grid-template-columns: 1.4fr 1fr; gap: var(--gap); }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 9px 10px;
      min-width: 0;
    }
    .trading-office-card {
      position: relative;
      padding: 12px;
      border-color: rgba(56,189,248,.2);
      background:
        radial-gradient(420px 180px at 5% 0%, rgba(56,189,248,.13), transparent),
        radial-gradient(320px 180px at 95% 0%, rgba(52,211,153,.1), transparent),
        rgba(14,20,34,.9);
      box-shadow: 0 18px 60px rgba(0,0,0,.18);
    }
    .card-h {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 8px; gap: 8px;
    }
    .card-h h2 {
      margin: 0; font-size: 11px; font-weight: 600;
      color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em;
    }

    .log {
      height: 168px; overflow: auto;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 7px;
      font-family: "JetBrains Mono", monospace;
      font-size: 10.5px;
      line-height: 1.4;
    }
    .log.tall { height: 220px; }
    .log-line { padding: 2px 0; border-bottom: 1px solid rgba(148,163,184,.06); }
    .log-line:last-child { border-bottom: none; }

    .pipeline-row {
      display: flex; flex-wrap: wrap; gap: 5px;
    }
    .office-pipeline {
      margin-top: 10px;
      padding: 8px 10px;
      border: 1px solid rgba(148,163,184,.12);
      border-radius: 12px;
      background: rgba(2,6,23,.32);
    }
    .office-pipeline-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 7px;
      color: var(--muted);
      font-size: 10px;
      font-weight: 900;
      letter-spacing: .06em;
      text-transform: uppercase;
    }
    .tv-mcp-panel {
      margin-top: 8px;
      padding: 7px 8px;
      border: 1px solid rgba(148,163,184,.12);
      border-radius: 8px;
      background: rgba(2,6,23,.34);
    }
    .tv-mcp-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 6px;
      color: var(--muted);
      font-size: 10px;
      font-weight: 900;
      letter-spacing: .06em;
      text-transform: uppercase;
    }
    .tv-mcp-body {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 5px 10px;
      font-family: "JetBrains Mono", monospace;
      font-size: 10px;
      line-height: 1.35;
    }
    .tv-mcp-line {
      min-width: 0;
      color: var(--muted);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .tv-mcp-line.full { grid-column: 1 / -1; }
    .tv-mcp-line b { color: var(--text); font-weight: 600; }
    .tv-mcp-badge {
      display: inline-flex;
      align-items: center;
      min-height: 20px;
      padding: 2px 7px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--surface-2);
      font-family: "JetBrains Mono", monospace;
      font-size: 10px;
      font-weight: 800;
    }
    .tv-mcp-badge.ok { color: var(--good); border-color: rgba(52,211,153,.38); background: rgba(6,78,59,.26); }
    .tv-mcp-badge.warn { color: var(--warn); border-color: rgba(251,191,36,.36); background: rgba(69,53,9,.28); }
    .tv-mcp-badge.fail { color: var(--bad); border-color: rgba(251,113,133,.4); background: rgba(127,29,29,.28); }
    .tv-mcp-badge.off { color: var(--muted); }
    .kanban-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 7px;
    }
    .kanban-col {
      min-height: 88px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 7px;
    }
    .kanban-col h3 {
      margin: 0 0 6px;
      font-size: 9px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .06em;
    }
    .agent-card {
      border: 1px solid rgba(148,163,184,.12);
      border-radius: 7px;
      padding: 5px 6px;
      margin-bottom: 5px;
      background: rgba(15,23,42,.58);
      font-size: 10px;
      line-height: 1.25;
    }
    .agent-card:last-child { margin-bottom: 0; }
    .agent-card b { display: block; font-size: 10.5px; color: var(--text); }
    .agent-card span { display: block; color: var(--muted); margin-top: 2px; }
    .trading-office {
      position: relative;
      display: grid;
      grid-template-columns: repeat(7, minmax(86px, 1fr));
      gap: 8px;
      min-height: 202px;
      padding: 36px 12px 12px;
      border: 1px solid rgba(56,189,248,.14);
      border-radius: 14px;
      background:
        radial-gradient(220px 110px at 15% 0%, rgba(56,189,248,.12), transparent),
        radial-gradient(180px 100px at 90% 15%, rgba(52,211,153,.1), transparent),
        linear-gradient(180deg, rgba(15,23,42,.76), rgba(2,6,23,.58));
      overflow: hidden;
    }
    .trading-office::before {
      content: "Hermes Trading Office";
      position: absolute;
      left: 14px; top: 10px;
      font-size: 10px;
      font-weight: 800;
      color: rgba(186,230,253,.85);
      letter-spacing: .08em;
      text-transform: uppercase;
    }
    .trading-scan-ticker {
      grid-column: 1 / -1;
      position: relative;
      height: 28px;
      margin-bottom: 2px;
      overflow: hidden;
      border: 1px solid rgba(52,211,153,.18);
      border-radius: 999px;
      background: rgba(2,6,23,.58);
      box-shadow: inset 0 0 18px rgba(52,211,153,.06);
    }
    .trading-scan-track {
      position: absolute;
      left: 0;
      top: 6px;
      display: inline-flex;
      width: max-content;
      white-space: nowrap;
      font-family: "JetBrains Mono", monospace;
      font-size: 10px;
      color: #a7f3d0;
      text-shadow: 0 0 14px rgba(52,211,153,.24);
      animation: scanTicker var(--ticker-duration, 56s) linear infinite;
    }
    .scan-tick-loop {
      display: inline-flex;
      min-width: max-content;
    }
    .trading-agents { display: contents; }
    .scan-tick-item { margin-right: 18px; color: #cbd5e1; }
    .scan-tick-side {
      display: inline-block;
      margin: 0 4px;
      padding: 1px 6px;
      border-radius: 999px;
      border: 1px solid currentColor;
      font-size: 9px;
      font-weight: 900;
      letter-spacing: .04em;
    }
    .scan-tick-side.long { color: #4ade80; background: rgba(34,197,94,.14); }
    .scan-tick-side.short { color: #fda4af; background: rgba(244,63,94,.14); }
    .scan-tick-side.wait { color: #fbbf24; background: rgba(251,191,36,.12); }
    .trading-agent {
      position: relative;
      display: grid;
      align-content: end;
      min-width: 0;
      min-height: 158px;
      padding: 34px 7px 8px;
      border: 1px solid rgba(148,163,184,.14);
      border-radius: 12px;
      background: rgba(15,23,42,.64);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.03);
      overflow: hidden;
    }
    .trading-agent.active {
      border-color: rgba(56,189,248,.48);
      box-shadow: 0 0 24px rgba(56,189,248,.16), inset 0 1px 0 rgba(255,255,255,.05);
    }
    .trading-agent.idle {
      border-color: rgba(250,204,21,.42);
      background: rgba(24,20,8,.56);
    }
    .trading-agent.done { border-color: rgba(134,239,172,.42); background: rgba(12,30,22,.5); }
    .trading-agent.todo { border-color: rgba(148,163,184,.18); background: rgba(15,23,42,.52); }
    .trading-agent.blocked { border-color: rgba(251,113,133,.5); }
    .trading-avatar {
      position: relative;
      width: 52px;
      height: 62px;
      margin: 0 auto 6px;
      animation: chibiIdle 3s ease-in-out infinite;
      animation-delay: var(--agent-delay, 0s);
    }
    .trading-agent.active .trading-avatar { animation: chibiWork 1s ease-in-out infinite; }
    .trading-agent.done .trading-avatar { animation: chibiHappy 2.6s ease-in-out infinite; }
    .trading-agent.blocked .trading-avatar { animation: chibiPanic .85s ease-in-out infinite; }
    .trading-head {
      position: absolute;
      top: 4px;
      left: 50%;
      transform: translateX(-50%);
      width: 40px;
      height: 38px;
      border-radius: 48% 48% 44% 44%;
      background: var(--skin-tone, #f7c59f);
      border: 2px solid #1e293b;
      box-shadow: inset 0 -4px 0 rgba(0,0,0,.06);
      z-index: 2;
    }
    .trading-head::before,
    .trading-head::after { content: none; }
    .trading-hair {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 44px;
      height: 18px;
      border-radius: 50% 50% 35% 35%;
      background: var(--agent-hair, #334155);
      border: 2px solid rgba(2,6,23,.55);

    @keyframes chibiIdle {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-3px) rotate(-1deg); }
    }
    @keyframes chibiWork {
      0%, 100% { transform: translateY(0) scale(1); }
      35% { transform: translateY(-5px) scale(1.04); }
      70% { transform: translateY(-2px) scale(1.02); }
    }
    @keyframes chibiHappy {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      25% { transform: translateY(-2px) rotate(2deg); }
      75% { transform: translateY(-2px) rotate(-2deg); }
    }
    @keyframes chibiPanic {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-3px) rotate(-4deg); }
      75% { transform: translateX(3px) rotate(4deg); }
    }
    @keyframes eyeSparkle {
      0%, 100% { transform: scaleY(1); }
      50% { transform: scaleY(.7); }
    }
    @keyframes agentIdle {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-3px); }
    }
    @keyframes agentWorking {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      25% { transform: translateY(-4px) rotate(-2deg); }
      75% { transform: translateY(-2px) rotate(2deg); }
    }
    @keyframes agentTyping {
      0%, 100% { transform: translateY(0); }
      20% { transform: translateY(-2px); }
      40% { transform: translateY(-5px); }
      60% { transform: translateY(-3px); }
      80% { transform: translateY(-6px); }
    }
    @keyframes agentDone {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-1px) scale(1.02); }
    }
    @keyframes agentAlert {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-3px) rotate(-2deg); }
      40% { transform: translateX(3px) rotate(2deg); }
      60% { transform: translateX(-2px); }
      80% { transform: translateX(2px); }
    }
    @keyframes toolPulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.22); } }
    @keyframes screenGlow {
      0% { background-position: 0% 50%; opacity: .85; }
      50% { opacity: 1; }
      100% { background-position: 200% 50%; opacity: .85; }
    }

    .office-room .trading-agent.active .trading-eye { animation: eyeSparkle .55s ease-in-out infinite; }
    .office-room .trading-arm {
      position: absolute;
      bottom: 18px;
      width: 10px;
      height: 5px;
      border-radius: 999px;
      background: var(--skin-tone, #f7c59f);
      border: 1px solid rgba(2,6,23,.55);
      z-index: 3;
    }
    .office-room .trading-arm.left { left: 11px; transform: rotate(24deg); }
    .office-room .trading-arm.right { right: 11px; transform: rotate(-24deg); }
    .office-room .trading-agent.active .trading-arm.left { animation: armTypeL .45s steps(2) infinite; }
    .office-room .trading-agent.active .trading-arm.right { animation: armTypeR .45s steps(2) infinite .12s; }
    @keyframes armTypeL {
      0%, 100% { transform: rotate(18deg) translateY(0); }
      50% { transform: rotate(32deg) translateY(-2px); }
    }
    @keyframes armTypeR {
      0%, 100% { transform: rotate(-18deg) translateY(0); }
      50% { transform: rotate(-32deg) translateY(-2px); }
    }
    .office-room .trading-tool {
      right: -1px;
      top: 8px;
      width: 22px;
      height: 22px;
      font-size: 12px;
      border-width: 2px;
    }
    .office-room .trading-status-badge {
      left: 50%;
      right: auto;
      top: 6px;
      transform: translateX(-50%);
      min-width: 54px;
      height: 19px;
      padding: 0 8px;
      border-radius: 999px;
      font-size: 8px;
      background: #f8fafc;
      color: #0f172a;
      border: 2px solid #cbd5e1;
      box-shadow: 2px 2px 0 rgba(0,0,0,.35);
    }
    .office-room .trading-agent.active .trading-status-badge { color: #0c4a6e; border-color: #7dd3fc; background: #e0f2fe; }
    .office-room .trading-agent.done .trading-status-badge { color: #14532d; border-color: #86efac; background: #dcfce7; }
    .office-room .trading-agent.blocked .trading-status-badge { color: #7f1d1d; border-color: #fda4af; background: #ffe4e6; }
    .office-room .trading-state {
      top: 7px;
      left: 7px;
      right: auto;
      width: 8px;
      height: 8px;
      border-radius: 2px;
    }
    .office-room .trading-name {
      font-family: "VT323", monospace;
      font-size: 13px;
      line-height: 1.05;
      white-space: normal;
      min-height: 22px;
      color: #e2e8f0;
      text-shadow: 0 1px 0 #020617;
    }
    .office-room .trading-runs {
      min-width: 18px;
      border-radius: 3px;
      font-size: 8px;
      margin-left: 2px;
    }
    .office-room .trading-action {
      min-height: 26px;
      margin-top: 4px;
      padding: 4px;
      border-radius: 3px;
      font-size: 8px;
      background: rgba(2,6,23,.58);
    }
    .office-room .trading-action b { display: none; }
    .office-room .room-prop {
      position: absolute;
      pointer-events: none;
      z-index: 0;
      image-rendering: pixelated;
    }
    .office-room .room-prop.plant {
      right: 10px; bottom: 10px;
      width: 18px; height: 28px;
      background:
        linear-gradient(#166534 0 8px, transparent 8px),
        linear-gradient(90deg, #15803d 0 6px, #22c55e 6px 12px, #15803d 12px 18px);
      border: 2px solid #052e16;
      border-radius: 2px;
      box-shadow: 3px 3px 0 rgba(0,0,0,.35);
    }
    .office-room .room-prop.shelf {
      left: 10px; bottom: 10px;
      width: 42px; height: 34px;
      border: 2px solid #3f2d16;
      border-radius: 2px;
      background:
        linear-gradient(#7c4a1d 0 8px, transparent 8px),
        repeating-linear-gradient(90deg, #92400e 0 6px, #b45309 6px 12px);
      box-shadow: 3px 3px 0 rgba(0,0,0,.35);
    }
    .office-room .room-prop.clock {
      top: 10px; right: 10px;
      width: 22px; height: 22px;
      border: 2px solid #334155;
      border-radius: 50%;
      background: radial-gradient(circle at 50% 50%, #f8fafc 0 2px, transparent 2px), #1e293b;
      box-shadow: 2px 2px 0 rgba(0,0,0,.35);
    }
    .office-room .room-prop.map {
      top: 36px; right: 12px;
      width: 34px; height: 22px;
      border: 2px solid #1d4ed8;
      border-radius: 2px;
      background:
        linear-gradient(90deg, #1e3a8a 0 50%, #22c55e 50% 100%),
        linear-gradient(#38bdf8 0 40%, transparent 40%);
      opacity: .85;
      box-shadow: 2px 2px 0 rgba(0,0,0,.35);
    }
    .trading-scan-ticker {
      grid-column: 1 / -1;
      border-radius: 5px;
      border: 2px solid #16466f;
      background: rgba(2,6,23,.86);
    }
    @media (max-width: 1180px) {
      .vo-app { grid-template-columns: 1fr; }
      .vo-sidebar {
        position: relative;
        height: auto;
        border-right: 0;
        border-bottom: 3px solid #123b63;
      }
      .trading-office { grid-template-columns: 1fr; }
    }
    @media (max-width: 760px) {
      html, body { width: 100%; }
      .vo-app {
        display: block;
        width: 100%;
        min-height: 100vh;
      }
      .vo-sidebar {
        position: relative;
        width: 100%;
        height: auto;
        max-height: none;
        border-right: 0;
        border-bottom: 2px solid #123b63;
      }
      .vo-main {
        width: 100%;
        padding: 0;
      }
      .trading-office-card,
      #view-monitor,
      #hermesKanban {
        width: 100%;
        min-width: 0;
      }
      .trading-office {
        width: 100%;
        min-height: 0;
        padding: 0;
        gap: 8px;
        border-left: 0;
        border-right: 0;
        border-radius: 0;
        grid-template-columns: 1fr;
      }
      .office-topbar { grid-template-columns: 1fr; }
      .office-daily-kpis { min-width: 0; }
      .office-main {
        width: 100%;
        grid-template-columns: 1fr;
        gap: 8px;
      }
      .office-room {
        width: 100%;
        min-height: 0;
        padding: 38px 8px 8px;
        border-left: 0;
        border-right: 0;
        border-radius: 0;
      }
      .room-title {
        left: 8px;
        min-width: 0;
        max-width: calc(100% - 16px);
      }
      .room-agents {
        width: 100%;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        grid-auto-rows: minmax(132px, auto);
        gap: 5px;
      }
      .office-room .trading-agent {
        width: 100%;
        min-height: 132px;
        padding: 24px 4px 5px;
        display: block;
      }
      .office-room .trading-avatar {
        width: 58px;
        height: 60px;
        margin: 0 auto 1px;
        transform: scale(.72);
        transform-origin: center;
      }
      .office-room .trading-desk {
        width: 36px;
        left: 50%;
        bottom: 53px;
      }
      .office-room .trading-monitor {
        width: 36px;
        height: 20px;
      }
      .office-room .trading-screen {
        width: 24px;
        height: 10px;
        margin-top: 3px;
      }
      .office-room .trading-chair {
        width: 30px;
        height: 7px;
      }
      .office-room .trading-status-badge {
        top: 5px;
        height: 17px;
        min-width: 48px;
        font-size: 7px;
        padding: 0 6px;
      }
      .office-room .trading-state {
        top: 8px;
        left: 8px;
      }
      .office-room .trading-tool {
        top: 5px;
        right: 6px;
        width: 20px;
        height: 20px;
        font-size: 11px;
      }
      .office-room .trading-name {
        min-height: 0;
        font-size: 12px;
        line-height: 1;
        text-align: center;
      }
      .office-room .trading-action {
        min-height: 30px;
        margin-top: 3px;
        padding: 3px;
        font-size: 7.5px;
        line-height: 1.2;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
    }
    .gate-chip {
      font-size: 10px; padding: 4px 8px; border-radius: 6px;
      border: 1px solid var(--border); background: var(--surface-2);
      font-family: "JetBrains Mono", monospace;
    }
    .gate-chip.ok { border-color: rgba(52,211,153,.35); color: var(--good); }
    .gate-chip.fail { border-color: rgba(251,113,133,.35); color: var(--bad); }

    .pill {
      padding: 1px 6px; border-radius: 999px; font-size: 10px; font-weight: 600;
      border: 1px solid; display: inline-block;
    }
    .pill-long { color: #4ade80; border-color: #22c55e; background: rgba(34,197,94,.1); }
    .pill-short { color: #fda4af; border-color: #f43f5e; background: rgba(244,63,94,.1); }
    .pill-wait { color: var(--warn); border-color: var(--warn); background: rgba(251,191,36,.08); }

    details.advanced {
      margin-bottom: var(--gap);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
    }
    details.advanced summary {
      padding: 10px 12px; cursor: pointer; font-size: 12px; font-weight: 500; color: var(--muted);
      list-style: none;
    }
    details.advanced summary::-webkit-details-marker { display: none; }
    details.advanced[open] summary { border-bottom: 1px solid var(--border); color: var(--text); }
    .adv-grid {
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px;
      padding: 10px 12px 12px;
    }
    .adv-grid .fld label { display: block; font-size: 10px; color: var(--muted); margin-bottom: 4px; }
    .chk-row { display: flex; flex-wrap: wrap; gap: 12px; padding: 0 12px 12px; font-size: 11px; color: var(--muted); }
    .chk-row label { display: flex; align-items: center; gap: 6px; cursor: pointer; }

    .learn-stats {
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 8px;
    }
    .learn-stat {
      background: var(--surface-2); border: 1px solid var(--border);
      border-radius: 8px; padding: 8px 10px;
    }
    .learn-stat .k { font-size: 10px; color: var(--muted); }
    .learn-stat .v { font-size: 13px; font-weight: 600; margin-top: 2px; }
    .learn-badge {
      display: inline-block;
      margin-left: 6px;
      padding: 2px 8px;
      border-radius: 999px;
      border: 1px solid var(--border);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.04em;
    }
    .learn-badge.ok { color: var(--good); border-color: rgba(52,211,153,.45); background: rgba(52,211,153,.12); }
    .learn-badge.warn { color: var(--warn); border-color: rgba(251,191,36,.45); background: rgba(251,191,36,.12); }
    .learn-badge.idle { color: var(--muted); border-color: var(--border); background: rgba(148,163,184,.08); }

    .busy-overlay {
      position: fixed; inset: 0; z-index: 9998;
      background: rgba(7,10,18,.2); backdrop-filter: blur(1px);
      display: none; cursor: progress;
    }
    .busy-overlay.show { display: block; }
    .toasts {
      position: fixed; right: 12px; bottom: 12px; z-index: 9999;
      display: flex; flex-direction: column; gap: 6px; width: min(300px, calc(100vw - 24px));
    }
    .toast {
      border-radius: 8px; padding: 8px 10px; border: 1px solid;
      font-size: 11px; box-shadow: 0 8px 24px rgba(0,0,0,.35);
      animation: toastIn .15s ease;
    }
    .toast.ok { background: rgba(6,78,59,.95); border-color: var(--good); }
    .toast.err { background: rgba(127,29,29,.95); border-color: var(--bad); }
    .toast.info { background: rgba(30,64,175,.95); border-color: var(--accent); }
    @keyframes toastIn { from { opacity: 0; transform: translateY(6px); } }
    @keyframes spin { to { transform: rotate(360deg); } }

    @media (max-width: 1200px) {
      .metrics { grid-template-columns: repeat(2, 1fr); }
      .grid-3 { grid-template-columns: 1fr 1fr; }
    }
    @media (max-width: 900px) {
      .metrics { grid-template-columns: repeat(2, 1fr); }
      .grid-3, .grid-2, .adv-grid, .learn-stats { grid-template-columns: 1fr; }
      .toolbar .sep { display: none; }
      .toolbar { gap: 8px; padding: 8px; }
      .toolbar .group.settings { width: 100%; }
      .fld-symbol, .fld-usdt, .fld-mode, .fld-lev { flex: 1 1 calc(50% - 6px); }
      .log { height: 148px; }
      .log.tall { height: 190px; }
    }
    @media (max-width: 520px) {
      .app { padding: 8px 8px 12px; }
      .header { gap: 6px; padding: 8px 0 10px; }
      .brand h1 { font-size: 16px; }
      .metrics { grid-template-columns: 1fr 1fr; gap: 7px; }
      .metric { padding: 8px 9px; }
      .metric .val { font-size: 13px; }
      .conn label { display: none; }
      .conn { width: 100%; justify-content: space-between; }
      .conn input { width: 100%; max-width: none; }
      .field-inline { flex-direction: column; align-items: stretch; gap: 4px; }
      .field-inline label {
        display: block;
        font-size: 10px;
        color: var(--muted);
        line-height: 1.1;
      }
      .fld-symbol, .fld-usdt, .fld-mode, .fld-lev { flex: 1 1 100%; }
      button.sm { padding: 7px 8px; font-size: 10px; }
      .toolbar .group:first-child { width: 100%; display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; }
      .toolbar .group:first-child button { width: 100%; }
      .toolbar .group.settings { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
      .toolbar .group.settings .field-inline { min-height: 48px; }
      .toolbar .group.settings .fld-symbol { grid-column: 1 / -1; }
      .toolbar .group.settings .fld-lev { grid-column: 1 / -1; }
      .toolbar input, .toolbar select { padding: 6px 8px; font-size: 11px; }
      .toolbar { padding: 7px; }
      .hint#levCapHint { width: 100%; text-align: right; display: block; }
      .tabs { gap: 3px; justify-content: center; }
      .tab { padding: 6px 9px; font-size: 10px; }
      .log { height: 132px; font-size: 10px; }
      .log.tall { height: 168px; }
      details.advanced summary { padding: 9px 10px; font-size: 11px; }
      .adv-grid { gap: 6px; padding: 8px 10px 10px; }
      .adv-grid { grid-template-columns: 1fr 1fr; }
      .adv-grid .fld:first-child { grid-column: 1 / -1; }
      .chk-row { gap: 8px; padding: 0 10px 10px; font-size: 10.5px; }
      .chk-row label { flex: 1 1 calc(50% - 8px); }
      .trading-office {
        grid-template-columns: 1fr;
        padding: 0;
        border-radius: 0;
      }
      .office-room {
        border-width: 2px;
        border-radius: 0;
        padding: 36px 6px 6px;
      }
      .room-agents {
        grid-template-columns: repeat(3, minmax(0, 1fr));
        grid-auto-rows: minmax(126px, auto);
        gap: 4px;
      }
      .office-room .trading-agent {
        min-height: 126px;
        padding: 22px 3px 5px;
      }
      .office-room .trading-avatar {
        width: 52px;
        height: 54px;
        transform: scale(.66);
        margin-bottom: -2px;
      }
      .office-room .trading-desk {
        left: 50%;
        bottom: 50px;
        width: 34px;
      }
      .office-room .trading-name { font-size: 11px; }
      .office-room .trading-action {
        min-height: 28px;
        font-size: 7px;
      }
      .trading-office-positions,
      .office-pipeline,
      .supervisor-review {
        width: 100%;
      }
      .kanban-row { grid-template-columns: 1fr 1fr; }
    }
    @media (max-width: 390px) {
      .metrics {
        grid-template-columns: 1fr 1fr;
        grid-template-areas:
          "hermes bot"
          "win pnl";
      }
      .metric.hermes { grid-area: hermes; }
      .metric.bot { grid-area: bot; }
      .metric.win { grid-area: win; }
      .metric.pnl { grid-area: pnl; }
      .conn input { width: 100%; }
      .vo-main { padding: 0; }
      .trading-office { padding: 0; }
      .office-room { padding-inline: 5px; }
      .room-agents { gap: 3px; }
      .office-room .trading-agent {
        min-height: 118px;
        padding-inline: 2px;
      }
      .office-room .trading-avatar {
        transform: scale(.58);
        margin-bottom: -8px;
      }
      .office-room .trading-name { font-size: 10px; }
      .office-room .trading-action { font-size: 6.5px; }
    }
  </style>
</head>
<body>
  <div class="vo-app">
    <aside class="vo-sidebar">
      <div class="vo-brand">
        <div class="vo-robot" aria-hidden="true">🤖</div>
        <div>
          <strong>Hermes Lab</strong>
          <span id="engineVer">—</span>
        </div>
      </div>
      <nav class="vo-nav" role="tablist" aria-label="Dashboard views">
        <button type="button" class="vo-tab active" data-tab="monitor">Office</button>
        <button type="button" class="vo-tab" data-tab="more">Logs</button>
      </nav>
      <div id="officeStatusPanel" class="vo-status-panel standby">
        <div id="officeStatusTitle" class="vo-status-title">STANDBY</div>
        <div class="vo-status-grid">
          <div class="vo-status-row"><span>Agents</span><b id="officeAgentsOnline">0/0</b></div>
          <div class="vo-status-row"><span>Tasks</span><b id="officeActiveTasks">0</b></div>
          <div class="vo-status-row"><span>Today</span><b id="officeTodayActivity">—</b></div>
          <div class="vo-status-row"><span>Hermes</span><b id="svcStatus">—</b></div>
          <div class="vo-status-row"><span>Bot</span><b id="botStatus">—</b></div>
          <div class="vo-status-row"><span>MC MCP</span><b id="tvMcpStatus">—</b></div>
        </div>
      </div>
      <div class="vo-kpi-mini metrics">
        <div class="metric win">
          <div class="lbl">Win</div>
          <div class="val" id="winRate">—</div>
          <div class="sub" id="winRateSub"></div>
        </div>
        <div class="metric pnl">
          <div class="lbl">PnL</div>
          <div class="val" id="realizedPnl">—</div>
          <div class="sub" id="pnlSub"></div>
        </div>
      </div>
      <div class="vo-controls">
        <div class="conn">
          <label>cmux</label>
          <input id="baseUrl" value="" placeholder="http://127.0.0.1:8030" />
          <button id="btnRefresh" class="btn-primary sm">↻</button>
        </div>
        <div class="toolbar-mini">
          <button id="serviceToggle" class="btn-good sm">Svc</button>
          <button id="botToggle" class="btn-primary sm">Bot</button>
          <button id="loadProPreset" class="btn-ghost sm" type="button">PRO</button>
        </div>
        <div class="vo-field-grid">
          <div class="field-inline fld-symbol">
            <label>Symbol</label>
            <select id="cfgSymbol"><option value="AUTO">AUTO</option></select>
          </div>
          <div class="field-inline fld-usdt">
            <label>USDT</label>
            <input id="cfgUsdt" type="number" value="50" />
          </div>
          <div class="field-inline fld-mode">
            <label>Mode</label>
            <select id="cfgMode"><option>PAPER</option><option>LIVE</option></select>
          </div>
          <div class="field-inline fld-lev">
            <label>Lev</label>
            <div class="range-inline">
              <input id="cfgLevMin" type="hidden" value="1" />
              <input id="cfgLevMax" type="number" value="25" min="1" max="25" />
            </div>
          </div>
        </div>
        <div class="vo-meta">
          <span id="levCapHint">cap x—</span>
          <span id="publishIpHeader">IP —</span>
          <span class="badge" id="engineBadge">pro</span>
        </div>
      </div>
    </aside>

    <main class="vo-main">
      <div id="backendBanner" class="status-banner"></div>

    <div id="view-monitor" class="panel-view active">
      <div class="card trading-office-card" style="border:0;background:transparent;padding:0;box-shadow:none">
        <div id="hermesKanban" class="trading-office"></div>
        <div class="office-pipeline">
          <div class="office-pipeline-head">
            <span>Entry pipeline</span>
            <span>gate compact</span>
          </div>
          <div id="entryPipeline" class="pipeline-row"></div>
          <div id="pipelineSkip" style="font-size:10px;color:var(--warn);margin-top:6px"></div>
          <div id="marketContextMcpPanel" class="tv-mcp-panel"></div>
        </div>
        <div class="trading-office-positions">
          <div class="sub-h">Positions <span>live/paper exposure</span></div>
          <div id="openPositions" class="log"></div>
        </div>
        <div id="hermesSupervisorReview" class="supervisor-review"></div>
      </div>
    </div>

    <div id="view-more" class="panel-view">
      <details class="advanced" open>
        <summary>Expert Settings · Benchmark · Pair lock · Learning</summary>
        <div class="adv-grid">
          <div class="fld"><label>Benchmark</label><input id="cfgBenchmarkSymbol" value="BTCUSDT" /></div>
          <div class="fld"><label>BM penalty %</label><input id="cfgBenchmarkPenalty" type="number" step="0.1" value="6" /></div>
          <div class="fld"><label>Max positions</label><input id="cfgMaxOpenPositions" type="number" min="1" max="20" value="6" /></div>
          <div class="fld"><label>Lock streak</label><input id="cfgPairLockStreak" type="number" value="2" /></div>
          <div class="fld"><label>Lock min</label><input id="cfgPairLockMinutes" type="number" value="45" /></div>
        </div>
        <div class="chk-row">
          <label><input id="cfgBenchmarkEnabled" type="checkbox" checked /> Benchmark filter</label>
          <label><input id="cfgPairLockEnabled" type="checkbox" checked /> Pair lock</label>
          <label><input id="cfgAutoLearn" type="checkbox" checked /> Auto learn</label>
        </div>
      </details>

      <div class="grid-2">
        <div class="card">
          <div class="card-h"><h2>Decision log</h2><span id="publicIp" style="font-size:10px;color:var(--muted);font-family:monospace"></span></div>
          <div id="log" class="log tall"></div>
        </div>

        <div class="card">
          <div class="card-h">

const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));

const CONTROL_BUTTON_IDS = ["btnRefresh", "serviceToggle", "botToggle", "learningTrainNow", "learningRefresh", "loadProPreset"];

function setGlobalControlLock(locked) {
  $("busyOverlay")?.classList.toggle("show", !!locked);

    const btn = $(id);

  }
}
function isControlLocked() { return activeActionCount > 0 || Date.now() < actionLockUntil; }

function pillSignal(sig) {
  const s = String(sig || "WAIT").toUpperCase();
  const cls = s === "LONG" ? "pill-long" : s === "SHORT" ? "pill-short" : "pill-wait";
  return `<span class="pill ${cls}">${s}</span>`;
}

function scanTickSignal(sig) {
  const s = String(sig || "WAIT").toUpperCase();
  const cls = s === "LONG" ? "long" : s === "SHORT" ? "short" : "wait";
  return `<span class="scan-tick-side ${cls}">${esc(s)}</span>`;
}

function compactAge(ts) {
  const n = Number(ts || 0);
  if (!Number.isFinite(n) || n <= 0) return "—";
  const sec = Math.max(0, Math.floor(Date.now() / 1000 - n));
  if (sec < 60) return `${sec}s`;
  const min = Math.floor(sec / 60);
  if (min < 60) return `${min}m`;
  return `${Math.floor(min / 60)}h`;
}

function marketContextMcpSummary(bot) {
  const cfg = bot?.config || {};
  const watcher = bot?.marketContextWatcher && typeof bot.marketContextWatcher === "object" ? bot.marketContextWatcher : {};
  const enabled = cfg.marketContextWatcherEnabled !== false;
  const updatedAt = Number(watcher.updatedAt || 0);
  const ageSec = updatedAt > 0 ? Math.max(0, Math.floor(Date.now() / 1000 - updatedAt)) : 999999;
  const interval = Math.max(60, Number(cfg.marketContextWatcherIntervalSec || 300));
  const findings = Array.isArray(watcher.findings) ? watcher.findings : [];
  const dataFailure = findings.some((x) => String(x?.condition || "").toLowerCase() === "mcp_data_failure");
  const recovery = watcher?.cmuxActionReport?.type === "marketcontext_mcp_recovered";
  const stale = enabled && updatedAt > 0 && ageSec > Math.max(180, interval * 2);
  let cls = "off";
  let label = "Off";
  if (!enabled) {
    label = "Off";
  } else if (watcher.ok === false || dataFailure) {
    cls = "fail";
    label = "Fail";
  } else if (!updatedAt) {
    cls = "warn";
    label = "Waiting";
  } else if (stale) {
    cls = "warn";
    label = "Stale";
  } else if (recovery) {
    cls = "ok";
    label = "Recovered";
  } else if (watcher.ok === true) {
    cls = findings.length ? "warn" : "ok";
    label = findings.length ? "Signal" : "OK";
  } else {
    cls = "warn";
    label = "Unknown";
  }
  return { watcher, findings, cls, label, updatedAt, ageSec, age: compactAge(updatedAt), stale, dataFailure, recovery };
}

function renderMarketContextMcpStatus(bot) {
  const s = marketContextMcpSummary(bot);
  if (ui.tvMcpStatus) {
    ui.tvMcpStatus.textContent = s.label;
    ui.tvMcpStatus.style.color = s.cls === "ok" ? "var(--good)" : s.cls === "fail" ? "var(--bad)" : s.cls === "warn" ? "var(--warn)" : "var(--muted)";
  }
  if (!ui.marketContextMcpPanel) return;
  const watcher = s.watcher || {};
  const first = s.findings[0] || {};
  const targets = Array.isArray(watcher.targets) ? watcher.targets : [];
  const targetText = targets.length
    ? targets.slice(0, 4).map((x) => `${String(x?.symbol || "—").toUpperCase()}${x?.side ? "/" + String(x.side).toUpperCase() : ""}`).join(", ")
    : "—";
  const condition = first.condition ? `${first.symbol || "—"} · ${first.condition}` : (s.recovery ? "recovered" : "no actionable finding");
  const signal = first.marketContextSignal || first.alignment || watcher.error || "—";
  const supervisor = watcher?.supervisorResult?.cmuxActionReport?.action
    || watcher?.cmuxActionReport?.action
    || watcher?.supervisorResult?.reason
    || "—";
  const portText = watcher.mcpPort
    ? String(watcher.mcpPort) + (watcher.preferredMcpPort && watcher.preferredMcpPort !== watcher.mcpPort ? ` fallback from ${watcher.preferredMcpPort}` : "")
    : "—";
  ui.marketContextMcpPanel.innerHTML = `
    <div class="tv-mcp-head">
      <span>MarketContext MCP</span>
      <span class="tv-mcp-badge ${esc(s.cls)}">${esc(s.label)}</span>
    </div>

      <div class="tv-mcp-line"><span>last</span> <b>${esc(s.age)}</b></div>
      <div class="tv-mcp-line"><span>port</span> <b title="${esc(portText)}">${esc(portText)}</b></div>
      <div class="tv-mcp-line"><span>targets</span> <b title="${esc(targetText)}">${esc(targets.length ? String(targets.length) : "0")}</b></div>
      <div class="tv-mcp-line full"><span>watch</span> <b title="${esc(targetText)}">${esc(targetText)}</b></div>
      <div class="tv-mcp-line full"><span>signal</span> <b title="${esc(signal)}">${esc(String(signal).slice(0, 120))}</b></div>
      <div class="tv-mcp-line full"><span>condition</span> <b title="${esc(condition)}">${esc(String(condition).slice(0, 120))}</b></div>
      <div class="tv-mcp-line full"><span>supervisor</span> <b title="${esc(supervisor)}">${esc(String(supervisor).slice(0, 120))}</b></div>
    </div>
  `;
}

function scanTickerPayload(bot) {
  const rows = Array.isArray(bot?.scanBoard) ? bot.scanBoard.slice(0, 8) : [];
  if (!rows.length) {
    const cfg = bot?.config || {};
    const cfgSymbol = String(cfg?.symbol || "").toUpperCase();
    const scanMode = !!cfg?.marketScan || cfgSymbol === "AUTO" || cfgSymbol === "SCAN";
    const decision = bot?.lastDecision || {};
    const decisionSymbol = String(decision?.symbol || cfgSymbol || "—").toUpperCase();
    const decisionSignal = String(decision?.signal || "").toUpperCase();
    const decisionConf = Number(decision?.confidence || 0);
    const skipCode = String(bot?.lastSkip?.code || "").toLowerCase();
    let text = "รอ market scan · Hermes กำลังเตรียมข้อมูล";
    if (!bot?.running) {
      text = "บอทหยุดทำงาน";
    } else if (!scanMode && decisionSignal) {
      const confText = Number.isFinite(decisionConf) && decisionConf > 0 ? ` c=${decisionConf.toFixed(2)}` : "";
      const waitText = skipCode === "signal_wait" || decisionSignal === "WAIT" ? " · รอสัญญาณ LONG/SHORT ชัดเจน" : "";
      text = `${decisionSymbol} ${decisionSignal}${confText}${waitText}`;
    } else if (!scanMode) {
      text = `${decisionSymbol} · วิเคราะห์เหรียญหลัก`;
    }
    return {
      key: `empty:${text}`,
      html: `<span class="scan-tick-item">${esc(text)}</span>`,
      durationMs: 42000,
    };
  }
  const parts = rows.map((row, idx) => {
    const symbol = String(row?.symbol || "—").toUpperCase();
    const side = String(row?.signal || row?.side || row?.decision || row?.action || "WAIT").toUpperCase();
    const conf = Number(row?.confidence || row?.conf || 0);
    const score = Number(row?.score || 0);
    const reason = String(row?.rejectReason || row?.reason || row?.status || row?.note || "").slice(0, 24);
    return {
      key: [idx + 1, symbol, side, conf.toFixed(2), score.toFixed(1), reason].join(":"),
      html: `<span class="scan-tick-item">#${idx + 1} <b>${esc(symbol)}</b> ${scanTickSignal(side)} c=${conf.toFixed(2)} s=${score.toFixed(1)} ${esc(reason)}</span>`,
    };
  });
  const textLen = parts.map((x) => x.key).join(" ").length;
  const durationMs = Math.max(48000, Math.min(140000, Math.round(textLen * 190)));
  return {
    key: parts.map((x) => x.key).join("|"),
    html: parts.map((x) => x.html).join(""),
    durationMs,
  };
}

function scanTickerLoopHtml(html) {
  const content = String(html || `<span class="scan-tick-item">รอ market scan</span>`);
  return `<span class="scan-tick-loop">${content}</span><span class="scan-tick-loop" aria-hidden="true">${content}</span>`;
}

function updateSymbolOptions(bot) {
  const sel = $("cfgSymbol");
  if (!sel) return;
  const current = String(sel.value || "AUTO").toUpperCase();
  const set = new Set(["AUTO"]);
  const add = (v) => {
    const s = String(v || "").toUpperCase().trim();
    if (s && s !== "AUTO" && s !== "SCAN" && /^[A-Z0-9]{3,20}USDT$/.test(s)) set.add(s);
  };
  add(bot?.config?.symbol);
  add(bot?.config?.primarySymbol);
  for (const r of (bot?.scanBoard || [])) add(r?.symbol);
  for (const r of (bot?.openLivePositions || [])) add(r?.symbol);
  for (const s of ["BTCUSDT","ETHUSDT","SOLUSDT","BNBUSDT","XRPUSDT"]) set.add(s);
  sel.innerHTML = Array.from(set).map((s) => `<option value="${s}">${s}</option>`).join("");
  sel.value = set.has(current) ? current : "AUTO";
}

function hasHermesOfficeState(bot) {
  const agents = bot?.hermesAgents?.agents;
  return !!(agents && typeof agents === "object" && Object.keys(agents).length);
}

function withLastRichBotStatus(data) {
  if (!data || typeof data !== "object") return data;
  const bot = data.bot && typeof data.bot === "object" ? data.bot : {};
  if (hasHermesOfficeState(bot)) {
    lastRichBotStatus = { ...bot };
    return data;
  }
  if (!lastRichBotStatus || !hasHermesOfficeState(lastRichBotStatus)) return data;
  const mergedBot = {
    ...lastRichBotStatus,
    ...bot,
    hermesAgents: lastRichBotStatus.hermesAgents,
    hermesSupervisorReview: bot.hermesSupervisorReview || lastRichBotStatus.hermesSupervisorReview,
    scanBoard: Array.isArray(bot.scanBoard) && bot.scanBoard.length ? bot.scanBoard : lastRichBotStatus.scanBoard,
    openLivePositions: Array.isArray(bot.openLivePositions) && bot.openLivePositions.length
      ? bot.openLivePositions
      : lastRichBotStatus.openLivePositions,
    log: Array.isArray(bot.log) && bot.log.length ? bot.log : lastRichBotStatus.log,
    lastDecision: bot.lastDecision && typeof bot.lastDecision === "object" && Object.keys(bot.lastDecision).length
      ? bot.lastDecision
      : lastRichBotStatus.lastDecision,
    marketContextWatcher: bot.marketContextWatcher && typeof bot.marketContextWatcher === "object" && Object.keys(bot.marketContextWatcher).length
      ? bot.marketContextWatcher

    lastCmuxReport: bot.lastCmuxReport || lastRichBotStatus.lastCmuxReport,
    externalSignalGuard: bot.externalSignalGuard || lastRichBotStatus.externalSignalGuard,

  return { ...data, bot: mergedBot, dashboardOfficeCached: true };

async function copyText(text) {
  if (navigator.clipboard && window.isSecureContext) {
    await navigator.clipboard.writeText(text);
    return;
  }
  const ta = document.createElement("textarea");
  ta.value = text;
  ta.setAttribute("readonly", "");
  ta.style.position = "fixed";
  ta.style.left = "-9999px";
  document.body.appendChild(ta);
  ta.select();
  const ok = document.execCommand("copy");
  ta.remove();
  if (!ok) throw new Error("copy failed");
}

function normalizedLeverageRange() {
  const cap = 25;
  let min0 = Math.max(1, Math.floor(Number($("cfgLevMin")?.value || 1)));
  let max0 = Math.max(1, Math.floor(Number($("cfgLevMax")?.value || cap)));
  min0 = Math.min(min0, cap);
  max0 = Math.min(Math.max(max0, min0), cap);
  if ($("cfgLevMin")) $("cfgLevMin").value = String(min0);
  if ($("cfgLevMax")) $("cfgLevMax").value = String(max0);
  localStorage.setItem(LEV_MIN_KEY, String(min0));
  localStorage.setItem(LEV_MAX_KEY, String(max0));
  return { min: min0, max: max0 };
}

async function applyLeverageConfigIfRunning() {
  if (levUpdateInFlight) return;
  try {
    levUpdateInFlight = true;
    const rs = await req("/status");
    const lev = normalizedLeverageRange();
    if (!rs?.bot?.running) return;
    const cfgRs = await req("/bot/config", "POST", { leverageMin: lev.min, leverageMax: lev.max, leverage: Math.min(lev.max, Math.max(lev.min, Number($("cfgLevMax")?.value || lev.max))), leverageAutoEnabled: true, adaptiveLeverageEnabled: true, adaptiveLeverageMax: lev.max });
    if (cfgRs?.bot?.ok === false) {
      const e = String(cfgRs?.bot?.error || cfgRs?.bot?.reason || "");
      // Some backend builds do not support /autotrade/config.
      // Keep new values in UI and apply on next Start payload.
      if (e.includes("HTTP 404")) {
        showToast("info", `Lev max saved x${lev.max} (apply on next Start)`);
        return;
      }
      throw new Error(e || "Leverage update failed");
    }
    showToast("ok", `Lev max x${lev.max}`);
    await refreshStatus();
  } catch (e) { showToast("err", String(e.message || e).slice(0, 100)); }
  finally { levUpdateInFlight = false; }
}

function cmuxUnreachableHint(base) {
  return `ไม่เชื่อมต่อ cmux (${base}) — รัน: cd backend && python cmux_service.py serve`;
}

function reqTimeoutByPath(path, fallbackMs = 15000) {
  const p = String(path || "");
  if (p === "/status/quick") return 12000;
  if (p === "/status") return 18000;
  if (p.startsWith("/bot/start") || p.startsWith("/service/start")) return 45000;
  return fallbackMs;
}

async function req(path, method = "GET", payload = null, timeoutMs = 15000) {
  const primary = (ui.baseUrl.value || "").replace(/\/$/, "") || defaultCmuxUrl;
  const fallback = defaultCmuxUrl.replace(/\/$/, "");
  const targets = primary === fallback ? [primary] : [primary, fallback];
  const effectiveTimeout = reqTimeoutByPath(path, timeoutMs);
  let lastErr = null;
  for (let i = 0; i < targets.length; i++) {
    const base = targets[i];
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), effectiveTimeout);
    try {
      const res = await fetch(base + path, {
        method,
        signal: ctrl.signal,
        headers: { "Content-Type": "application/json" },
        body: payload ? JSON.stringify(payload) : undefined,
      });
      const txt = await res.text();
      const data = txt ? JSON.parse(txt) : { ok: res.ok };
      if (!res.ok || data?.ok === false) {
        throw new Error(humanizeErr(data?.error || data?.detail || `HTTP ${res.status}`));
      }
      if (ui.baseUrl.value !== base) ui.baseUrl.value = base;
      return data;
    } catch (e) {
      if (e?.name === "AbortError") lastErr = new Error(`cmux timeout (${base}) — ${cmuxUnreachableHint(base)}`);
      else if (!e?.message || e.message === "Failed to fetch") lastErr = new Error(cmuxUnreachableHint(base));
      else lastErr = e;
      if (i < targets.length - 1) await new Promise((r) => setTimeout(r, 300));
    } finally {
      clearTimeout(timer);
    }
  }
  throw lastErr || new Error(cmuxUnreachableHint(primary));
}

function humanizeErr(detail) {
  const s = String(detail || "");
  if (s.includes("-4411") || s.includes("agreement contract fapi")) {
    return "ต้องยอมรับข้อตกลง Binance Futures ก่อน LIVE";
  }
  if (s.includes("-2015") || s.includes("Invalid API-key, IP, or permissions")) {
    return "API-key / IP / permission ของ Binance Futures ยังไม่ผ่าน";
  }
  return s;
}

async function precheckLiveBeforeStart(payload) {
  if (String(payload?.executionMode || "PAPER").toUpperCase() !== "LIVE") return;
  let sym = String(payload?.symbol || "BTCUSDT").toUpperCase();
  if (!sym || sym === "AUTO" || sym === "SCAN") sym = "BTCUSDT";
  try {
    const rs = await req(`/bot/precheck-live?symbol=${encodeURIComponent(sym)}`);
    const pre = rs?.precheck || {};
    // Hard block only when server explicitly confirms agreement is required.
    if (pre.agreementRequired === true) {
      throw new Error("LIVE pre-check ไม่ผ่าน — ยอมรับข้อตกลง Binance ก่อน");
    }
    // If precheck endpoint is unavailable/404, continue start (server has its own fallback).
    if (pre.ok === false) {
      showToast("info", "LIVE pre-check ไม่สมบูรณ์ — จะเริ่มต่อและให้ระบบตรวจซ้ำ");
    }
  } catch (e) {
    const msg = String(e?.message || e);
    if (msg.includes("LIVE pre-check ไม่ผ่าน")) throw e;
    showToast("info", "ข้าม pre-check ชั่วคราว แล้วเริ่ม LIVE ต่อ");
  }
}

function showToast(type, message) {
  const root = $("toasts");
  if (!root) return;
  const el = document.createElement("div");
  el.className = `toast ${type}`;
  el.textContent = message;
  root.appendChild(el);
  while (root.children.length > 3) root.removeChild(root.firstChild);
  setTimeout(() => el.remove(), 2400);
}

async function withBusy(button, fn) {
  if (!button || button.dataset.busy === "1" || isControlLocked()) return;
  const oldText = button.textContent;
  button.dataset.busy = "1";
  button.disabled = true;
  button.classList.add("busy");
  activeActionCount++;
  setGlobalControlLock(true);
  try {
    return await fn();
  } catch (e) {
    showToast("err", String(e.message || e).slice(0, 140));
    throw e;
  } finally {
    button.dataset.busy = "0";
    button.disabled = false;
    button.classList.remove("busy");
    button.textContent = oldText;
    activeActionCount = Math.max(0, activeActionCount - 1);
    if (!activeActionCount) setGlobalControlLock(false);
  }
}
